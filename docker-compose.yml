services:
  postgres:
    image: postgres:16-alpine
    container_name: tcg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg
      POSTGRES_DB: tcg
    ports:
      - "5432:5432"
    volumes:
      - tcg-pgdata:/var/lib/postgresql/data

volumes:
  tcg-pgdata:
